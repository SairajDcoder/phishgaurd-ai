<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 320px;
            font-family: sans-serif;
            background-color: #0f172a;
            color: white;
            padding: 16px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #60a5fa;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(to right, #2563eb, #06b6d4);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .safe {
            background-color: #064e3b;
            border: 1px solid #10b981;
        }

        .phishing {
            background-color: #450a0a;
            border: 1px solid #ef4444;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <h1>🛡️ PhishGuard</h1>
    <p id="url" style="font-size: 12px; color: #94a3b8; margin-bottom: 15px; word-break: break-all;">...</p>

    <button id="scanBtn" class="btn">SCAN CURRENT TAB</button>

    <div id="loader" class="loader">⚡ Connecting to Neural Network...</div>

    <div id="result" class="result">
        <h2 id="verdict" style="margin: 0; font-size: 20px;"></h2>
        <p id="score" style="margin: 5px 0 0 0; font-size: 14px; opacity: 0.8;"></p>
    </div>

    <script src="popup.js"></script>
</body>

</html>
